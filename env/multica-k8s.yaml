apiVersion: v1
kind: Namespace
metadata:
  name: multica
  labels:
    app.kubernetes.io/name: multica
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: multica-postgres-pv
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: postgres
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: multica-local
  local:
    path: /var/lib/multica/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "192.168.11.173"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: multica-uploads-pv
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: backend
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: multica-local
  local:
    path: /var/lib/multica/uploads
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "192.168.11.173"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: multica
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: multica-local
  volumeName: multica-postgres-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: multica
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: multica-local
  volumeName: multica-uploads-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multica-config
  namespace: multica
data:
  PORT: "8080"
  APP_ENV: "production"
  MULTICA_DATABASE_STARTUP_TIMEOUT: "3m"
  MULTICA_DATABASE_CONNECT_TIMEOUT: "5s"
  MULTICA_APP_URL: "http://192.168.11.173:30080"
  MULTICA_PUBLIC_URL: "http://192.168.11.173:30081"
  FRONTEND_ORIGIN: "http://192.168.11.173:30080"
  CORS_ALLOWED_ORIGINS: "http://192.168.11.173:30080"
  GOOGLE_REDIRECT_URI: "http://192.168.11.173:30080/auth/callback"
  LOCAL_UPLOAD_BASE_URL: "http://192.168.11.173:30080"
  ALLOW_SIGNUP: "true"
  DISABLE_WORKSPACE_CREATION: "false"
  MULTICA_VCS_INTEGRATION_ENABLED: "true"
  MULTICA_ENTITLEMENT_POLICY_ENABLED: "false"
  MULTICA_TASK_QUEUED_TTL: "2h"
  RATE_LIMIT_TRUSTED_PROXIES: "172.20.0.0/16"
  MULTICA_TRUSTED_PROXIES: "172.20.0.0/16"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-postgres
  namespace: multica
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: prepare-data-dir
          image: pgvector/pgvector:pg17
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - mkdir -p /var/lib/postgresql/data/pgdata && chown -R postgres:postgres /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          imagePullPolicy: Never
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: multica
            - name: POSTGRES_USER
              value: multica
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multica-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: multica-postgres
  namespace: multica
spec:
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-backend
  namespace: multica
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: multica-backend:0a54725
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: multica-config
            - secretRef:
                name: multica-smtp
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multica-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://multica:$(POSTGRES_PASSWORD)@multica-postgres:5432/multica?sslmode=disable"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: multica-secrets
                  key: JWT_SECRET
            - name: MULTICA_VCS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: multica-secrets
                  key: MULTICA_VCS_SECRET_KEY
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: multica-backend
  namespace: multica
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-frontend
  namespace: multica
  labels:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: frontend
          image: multica-web:0a54725
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: REMOTE_API_URL
              value: "http://multica-backend:8080"
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: multica-frontend
  namespace: multica
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: multica
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: multica
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 5432
